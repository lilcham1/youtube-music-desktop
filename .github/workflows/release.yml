name: Publish Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install build tools
        run: |
          go install github.com/tc-hib/go-winres@latest
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress }
          "C:\Program Files (x86)\NSIS" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Build
        run: .\build.ps1 -Version $env:GITHUB_REF_NAME.TrimStart('v')
      - name: Attach installer and update feed
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/YouTube-Music-Setup-*.exe
            dist/latest.yml
